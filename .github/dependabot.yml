version: 2
# 🧊 הקפאה 15/10/2026: open-pull-requests-limit: 0 עוצר PR-ים של עדכוני-גרסה בזמן שאין מי שיבדוק אותם
#   (המלצת GitHub: limit 0 משבית עדכוני-גרסה ומשאיר עדכוני-אבטחה). בחזרה מהקפאה — להחזיר ל-5 (ר' FREEZE.md).
updates:
  # target-branch: dev — בלי זה Dependabot ממקד לברירת-המחדל של הריפו (main),
  # ועוקף את מדיניות "main מתעדכן רק באבני-דרך" (07/08/2026: 7 PRs נחתו ישירות ב-main).
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
