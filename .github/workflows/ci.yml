# שער האיכות של המאמר (§3-4): רץ אוטומטית בכל PR ובכל דחיפה ל-dev/main.
# חוסם מיזוג של קוד ששובר lint / בדיקות / build, וסורק דלף סודות.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  quality-gate:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint כולל את כללי sonarjs (כפילות/מורכבות). מאז 29/07/2026 הם ברמת 'error'
      # (eslint.config.js) — כלומר מורכבות מעל 20 או קוד כפול **מפילים את השלב הזה**
      # וחוסמים מיזוג. עד אז הם היו 'warn' כדי לא לחסום קוד קיים באמצע בניית מודול 3.
      - name: Lint
        run: npm run lint

      # פורמט (Prettier) — נוסף 23/07/2026 אחרי ש-.gitattributes תוקן ל-LF-לכל-קובץ-טקסט
      # (הבעיה הייתה רק בעותקים-מקומיים על Windows; מה שמחובר ל-Git תמיד היה נקי, אז
      # השלב הזה חוסם מהיום הראשון בלי הפתעות).
      - name: Format check
        run: npm run format:check

      # שער-כפילות (jscpd) — **חוסם מאז 29/07/2026**: כפילות מעל הסף (3% ב-.jscpd.json)
      # מפילה את השלב. הכפילות המקורית (UsersManagementPage↔CustomersPage) נפתרה 25/07
      # בחילוץ src/components/LoadingOrError.jsx.
      - name: Duplication scan (jscpd)
        run: npm run dup

      # שער-קוד-מת (knip) — **חוסם מאז 29/07/2026**. ארבעת הממצאים שקדמו לו נסגרו באותו יום:
      # 3 devDependencies יתומות הוסרו, ו-MARKETING_MAX_BYTES נעשה בשימוש אמיתי בקומפוננטה.
      - name: Dead code scan (knip)
        run: npm run deadcode

      # שער-חולשות-אבטחה בחבילות — **חוסם מאז 29/07/2026**. הפקודה מריצה את
      # scripts/audit-gate.mjs (ולא `npm audit` ישירות): הוא חוסם על כל חולשה high/critical
      # שאינה ברשימת-הפטורים המנומקת שבראשו, ומדפיס כל פטור בכל ריצה. 4 מ-6 החולשות
      # ההיסטוריות נסגרו ב-`npm audit fix`; הנותרת (react-router GHSA-qwww-vcr4-c8h2)
      # מפוטרת כי היא נוגעת רק ל-RSC APIs שהאפליקציה הזו אינה משתמשת בהם.
      - name: Dependency vulnerability scan (audit-gate)
        run: npm run audit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action קורא ל-GET /pulls/{n}/commits כדי לסרוק את הקומיטים של ה-PR —
    # דורש pull-requests:read. בלי בלוק זה ה-GITHUB_TOKEN מקבל רק contents:read
    # (ברירת-המחדל המצומצמת) והפעולה נופלת ב-403. contents:read נדרש ל-checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # נכשל אם נמצא מפתח/סוד בקוד. חינמי לריפו אישי/ציבורי;
      # לארגון יש להוסיף secret בשם GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
