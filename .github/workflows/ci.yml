# שער האיכות של המאמר (§3-4): רץ אוטומטית בכל PR ובכל דחיפה ל-dev/main.
# חוסם מיזוג של קוד ששובר lint / בדיקות / build, וסורק דלף סודות.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  quality-gate:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint כולל מעכשיו את כללי sonarjs (כפילות/מורכבות) ברמת 'warn' — הם מופיעים
      # בלוג אבל לא מפילים את השלב. אחרי סגירת מודול 3: מהדקים ל-'error' (eslint.config.js)
      # ואז השלב הזה יחסום אוטומטית (החלטת-ישי 23/07/2026).
      - name: Lint
        run: npm run lint

      # פורמט (Prettier) — נוסף 23/07/2026 אחרי ש-.gitattributes תוקן ל-LF-לכל-קובץ-טקסט
      # (הבעיה הייתה רק בעותקים-מקומיים על Windows; מה שמחובר ל-Git תמיד היה נקי, אז
      # השלב הזה חוסם מהיום הראשון בלי הפתעות).
      - name: Format check
        run: npm run format:check

      # שער-כפילות (jscpd) — כרגע מדווח-ולא-חוסם (continue-on-error) בשלב-האזהרות.
      # ⚠️ הידוק אחרי מ3: להסיר את continue-on-error כדי שכפילות מעל הסף (3% ב-.jscpd.json)
      # תחסום מיזוג. מרוכז עם הידוק-ה-sonarjs כשמודול 3 נסגר.
      - name: Duplication scan (jscpd)
        run: npm run dup
        continue-on-error: true

      # שער-קוד-מת (knip) — כרגע מדווח-ולא-חוסם (continue-on-error) בשלב-האזהרות.
      # ⚠️ הידוק אחרי מ3: להסיר continue-on-error יחד עם הקשחת jscpd/sonarjs (ר' module-3.md §9).
      - name: Dead code scan (knip)
        run: npm run deadcode
        continue-on-error: true

      # שער-חולשות-אבטחה בחבילות (npm audit, severity high+) — כרגע מדווח-ולא-חוסם: יש
      # 7 ממצאים קיימים (4 high — react-router/postcss/shadcn) שקדמו לשלב הזה ודורשים
      # החלטת-שדרוג נפרדת (חלקם breaking change). ⚠️ הידוק: להסיר continue-on-error אחרי
      # שהחולשות הקיימות טופלו/וותרו במפורש — לא בהכרח קשור לזמן סגירת-מ3 (ר' module-3.md §9).
      - name: Dependency vulnerability scan (npm audit)
        run: npm run audit
        continue-on-error: true

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action קורא ל-GET /pulls/{n}/commits כדי לסרוק את הקומיטים של ה-PR —
    # דורש pull-requests:read. בלי בלוק זה ה-GITHUB_TOKEN מקבל רק contents:read
    # (ברירת-המחדל המצומצמת) והפעולה נופלת ב-403. contents:read נדרש ל-checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # נכשל אם נמצא מפתח/סוד בקוד. חינמי לריפו אישי/ציבורי;
      # לארגון יש להוסיף secret בשם GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
